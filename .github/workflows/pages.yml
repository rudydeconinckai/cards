# Publiceert Kaartbeheer op GitHub Pages bij elke push naar main.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site samenstellen
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icon-*.png vendor _site/
      - name: Versienummer invullen
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/g; s/__DATE__/$(date -u +%Y-%m-%d)/g" _site/index.html _site/sw.js
          if grep -q "__BUILD__" _site/index.html _site/sw.js; then echo "Versienummer niet ingevuld"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
